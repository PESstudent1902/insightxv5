<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈ F404 — Admin Panel</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #111827;
      --border: #1f2d40;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px;
      width: 360px;
    }
    .login-box h1 { font-size: 1.2rem; margin-bottom: 4px; }
    .login-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    #login-btn, .btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #login-err { color: var(--red); font-size: 0.85rem; margin-top: 10px; min-height: 18px; }

    /* Main panel */
    #admin-panel { display: none; }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; }
    header h1 span { color: var(--accent); }
    #timer-display {
      font-family: 'Courier New', monospace;
      color: var(--accent);
      background: #1a1200;
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 4px;
    }
    #logout-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #logout-btn:hover { border-color: var(--text); color: var(--text); }

    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .card-body { padding: 16px; }

    .layer-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .layer-row:last-child { border-bottom: none; }
    .layer-id { font-weight: 700; min-width: 50px; }
    .layer-name { color: var(--muted); font-size: 0.82rem; flex: 1; min-width: 120px; }
    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .badge.unlocked { background: #052e16; color: var(--green); border: 1px solid var(--green); }
    .badge.locked   { background: #1c1917; color: var(--muted); border: 1px solid var(--muted); }
    .badge.timer    { background: #1e1a00; color: var(--accent); border: 1px solid var(--accent); }
    .layer-btns { display: flex; gap: 4px; margin-left: auto; }
    .sm-btn {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid;
      cursor: pointer;
      background: transparent;
    }
    .sm-btn.green { border-color: var(--green); color: var(--green); }
    .sm-btn.red   { border-color: var(--red);   color: var(--red); }
    .sm-btn.muted { border-color: var(--muted); color: var(--muted); }
    .sm-btn:hover { opacity: 0.75; }

    .bulk-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .bulk-btns button {
      flex: 1;
      min-width: 130px;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid;
      cursor: pointer;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .bulk-btns .btn-green { border-color: var(--green); color: var(--green); }
    .bulk-btns .btn-red   { border-color: var(--red);   color: var(--red); }
    .bulk-btns .btn-blue  { border-color: var(--blue);  color: var(--blue); }
    .bulk-btns .btn-muted { border-color: var(--muted); color: var(--muted); }
    .bulk-btns button:hover { opacity: 0.75; }

    .shift-row { display: flex; gap: 8px; align-items: center; }
    .shift-row input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 4px;
    }
    .shift-row button {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    .start-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .start-row button {
      background: var(--green);
      color: #000;
      border: none;
      padding: 9px 20px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }
    #started-at { font-size: 0.82rem; color: var(--muted); }

    .submissions-list { max-height: 280px; overflow-y: auto; }
    .sub-row {
      font-size: 0.83rem;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .sub-row:last-child { border-bottom: none; }
    .sub-row strong { color: var(--accent); }
    .sub-ts { color: var(--muted); font-size: 0.75rem; }

    #export-btn {
      display: block;
      text-align: center;
      margin-top: 12px;
      background: transparent;
      border: 1px solid var(--blue);
      color: var(--blue);
      padding: 7px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-box">
      <h1>✈ Flight 404 — Admin</h1>
      <p>Volunteer access only</p>
      <div class="form-group">
        <label>Username</label>
        <input id="usr" type="text" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="pwd" type="password" autocomplete="current-password" />
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">Log In</button>
      <div id="login-err"></div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="admin-panel">
    <header>
      <div>
        <h1>✈ FLIGHT <span>404</span> — Admin Panel</h1>
      </div>
      <div id="timer-display">--:--:--</div>
      <button id="logout-btn" onclick="doLogout()">Log Out</button>
    </header>
    <main>
      <div class="grid2">
        <!-- Clock & Game Start -->
        <div class="card">
          <div class="card-head">Game Clock</div>
          <div class="card-body">
            <div class="start-row" style="margin-bottom:16px">
              <button onclick="startGame()">▶ Start Game Clock</button>
              <span id="started-at">Not started</span>
            </div>
            <div style="margin-bottom:8px;font-size:0.82rem;color:var(--muted)">Shift clock (±minutes):</div>
            <div class="shift-row">
              <input id="shift-input" type="number" placeholder="e.g. +15 or -5" />
              <button onclick="shiftClock()">Apply</button>
            </div>
          </div>
        </div>

        <!-- Bulk Controls -->
        <div class="card">
          <div class="card-head">Bulk Controls</div>
          <div class="card-body">
            <div class="bulk-btns">
              <button class="btn-green" onclick="unlockAll()">Unlock All Layers</button>
              <button class="btn-red"   onclick="lockAll()">Lock All Layers</button>
              <button class="btn-blue"  onclick="revertAll()">Revert All to Timer</button>
              <button class="btn-muted" onclick="resetGame()">⚠ Full Game Reset</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Layer controls -->
      <div class="card" style="margin-top:24px">
        <div class="card-head">Layer Controls</div>
        <div class="card-body" id="layer-list">Loading…</div>
      </div>

      <!-- Submissions -->
      <div class="card" style="margin-top:24px">
        <div class="card-head">Team Submissions (<span id="sub-count">0</span>)</div>
        <div class="card-body">
          <div class="submissions-list" id="sub-list">No submissions yet.</div>
          <a id="export-btn" href="/api/admin/export-csv" target="_blank">⬇ Export CSV</a>
        </div>
      </div>
    </main>
  </div>

  <div id="toast"></div>

  <script>
    let startedAt = null;
    let clockOffset = 0;

    // ─ Auth ──────────────────────────────────────────────────────────────────
    async function doLogin() {
      const usr = document.getElementById('usr').value;
      const pwd = document.getElementById('pwd').value;
      const err = document.getElementById('login-err');
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usr, password: pwd }),
          credentials: 'same-origin',
        });
        if (res.ok) { showPanel(); }
        else { err.textContent = 'Invalid credentials'; }
      } catch (e) { err.textContent = e.message; }
    }

    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogout() {
      await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' });
      location.reload();
    }

    async function checkAuth() {
      const res = await fetch('/api/admin/me', { credentials: 'same-origin' });
      const d = await res.json();
      if (d.admin) showPanel();
    }

    function showPanel() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      refreshAll();
    }

    // ─ State ─────────────────────────────────────────────────────────────────
    async function refreshAll() {
      await Promise.all([refreshState(), refreshSubmissions()]);
    }

    async function refreshState() {
      try {
        const res = await fetch('/api/state', { credentials: 'same-origin' });
        const data = await res.json();
        startedAt = data.startedAt ? new Date(data.startedAt) : null;
        clockOffset = data.clockOffset || 0;
        document.getElementById('started-at').textContent =
          startedAt ? `Started: ${startedAt.toLocaleTimeString()}` : 'Not started';
        renderLayers(data.layers);
      } catch (_) {}
    }

    function renderLayers(layers) {
      const el = document.getElementById('layer-list');
      if (!layers) return;
      el.innerHTML = layers.map(l => `
        <div class="layer-row">
          <span class="layer-id">Layer ${l.id}</span>
          <span class="layer-name">${l.name} (T+${l.unlockMinutes}min)</span>
          <span class="badge ${l.override === 'timer' ? (l.isUnlocked ? 'unlocked' : 'locked') : l.override}">
            ${l.override === 'timer' ? (l.isUnlocked ? '✓ Unlocked (timer)' : 'Locked (timer)') : l.override.toUpperCase()}
          </span>
          <div class="layer-btns">
            <button class="sm-btn green" onclick="forceUnlock('${l.id}')">Unlock</button>
            <button class="sm-btn red"   onclick="forceLock('${l.id}')">Lock</button>
            <button class="sm-btn muted" onclick="revertLayer('${l.id}')">Timer</button>
          </div>
        </div>
      `).join('');
    }

    async function refreshSubmissions() {
      try {
        const res = await fetch('/api/admin/submissions', { credentials: 'same-origin' });
        if (!res.ok) return;
        const subs = await res.json();
        document.getElementById('sub-count').textContent = subs.length;
        const el = document.getElementById('sub-list');
        if (!subs.length) { el.innerHTML = '<div style="color:var(--muted);font-size:0.85rem">No submissions yet.</div>'; return; }
        el.innerHTML = subs.slice().reverse().map(s => `
          <div class="sub-row">
            <strong>${escHtml(s.team)}</strong>
            <span class="sub-ts"> · ${new Date(s.ts).toLocaleTimeString()}</span>
            <div style="white-space:pre-wrap;margin-top:4px;color:var(--text)">${escHtml(s.answer)}</div>
          </div>
        `).join('');
      } catch (_) {}
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ─ Actions ────────────────────────────────────────────────────────────────
    async function api(url, opts = {}) {
      const res = await fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
      if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Error'); }
      return res.json();
    }

    async function startGame() {
      await api('/api/admin/start');
      toast('Game clock started!');
      await refreshState();
    }

    async function forceUnlock(layer) { await api(`/api/admin/unlock/${layer}`); toast(`Layer ${layer} unlocked`); await refreshState(); }
    async function forceLock(layer)   { await api(`/api/admin/lock/${layer}`);   toast(`Layer ${layer} locked`);   await refreshState(); }
    async function revertLayer(layer) { await api(`/api/admin/revert/${layer}`); toast(`Layer ${layer} reverted to timer`); await refreshState(); }

    async function unlockAll() { await api('/api/admin/unlock-all'); toast('All layers unlocked'); await refreshState(); }
    async function lockAll()   { await api('/api/admin/lock-all');   toast('All layers locked');   await refreshState(); }

    async function revertAll() {
      const layers = ['1','2','2B','3','4','5','6','7'];
      await Promise.all(layers.map(l => api(`/api/admin/revert/${l}`)));
      toast('All layers reverted to timer');
      await refreshState();
    }

    async function resetGame() {
      if (!confirm('Reset the entire game? This clears the clock, overrides and submissions.')) return;
      await api('/api/admin/reset');
      toast('Game reset!');
      await refreshAll();
    }

    async function shiftClock() {
      const val = parseFloat(document.getElementById('shift-input').value);
      if (!isFinite(val)) { alert('Enter a number of minutes'); return; }
      await api('/api/admin/shift-clock', { body: JSON.stringify({ minutes: val }) });
      document.getElementById('shift-input').value = '';
      toast(`Clock shifted by ${val > 0 ? '+' : ''}${val} min`);
      await refreshState();
    }

    // ─ Timer ─────────────────────────────────────────────────────────────────
    function updateTimer() {
      const el = document.getElementById('timer-display');
      if (!startedAt) { el.textContent = 'Not started'; return; }
      const elapsed = (Date.now() - startedAt.getTime()) / 1000 + clockOffset * 60;
      const h = Math.floor(elapsed / 3600);
      const m = Math.floor((elapsed % 3600) / 60);
      const s = Math.floor(elapsed % 60);
      el.textContent = `T+ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // ─ Toast ──────────────────────────────────────────────────────────────────
    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ─ Init ──────────────────────────────────────────────────────────────────
    checkAuth();
    setInterval(updateTimer, 1000);
    setInterval(refreshAll, 15000);
    updateTimer();
  </script>
</body>
</html>
