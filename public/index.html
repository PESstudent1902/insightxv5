<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈ FLIGHT 404 — Murder Mystery</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --panel: #111827;
      --border: #1f2d40;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #64748b;
      --code-bg: #0d1117;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.3rem; letter-spacing: 0.05em; }
    header h1 span { color: var(--accent); }
    #timer {
      margin-left: auto;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      color: var(--accent);
      background: #1a1200;
      border: 1px solid var(--accent);
      padding: 4px 14px;
      border-radius: 4px;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    section { margin-bottom: 32px; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }
    .layers-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .layer-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .layer-chip.unlocked { background: #052e16; border-color: var(--green); color: var(--green); }
    .layer-chip.locked   { background: #1c1917; border-color: var(--muted); color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.unlocked { background: var(--green); }
    .dot.locked   { background: var(--muted); }

    .query-area {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .query-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .query-toolbar label { font-size: 0.85rem; color: var(--muted); }
    #sql-input {
      width: 100%;
      background: var(--code-bg);
      color: #a6e22e;
      border: none;
      padding: 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 100px;
      outline: none;
    }
    #run-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #run-btn:hover { background: #fbbf24; }
    #error-msg {
      color: var(--red);
      font-size: 0.85rem;
      padding: 10px 14px;
      display: none;
    }
    .results-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      background: #1e293b;
      color: var(--accent);
      text-align: left;
      padding: 8px 12px;
      font-family: 'Courier New', monospace;
    }
    td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      font-family: 'Courier New', monospace;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #131f33; }
    #row-count { padding: 8px 14px; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); }

    .submit-form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
    .field label { font-size: 0.8rem; color: var(--muted); }
    .field input, .field textarea {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .field textarea { resize: vertical; min-height: 70px; font-family: inherit; }
    #submit-btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }
    #submit-btn:hover { opacity: 0.9; }
    #submit-msg { font-size: 0.85rem; margin-top: 8px; }
    .hint { font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>✈ FLIGHT <span>404</span></h1>
      <div style="font-size:0.8rem;color:var(--muted)">Murder Mystery Studyathon — SQL Investigation Console</div>
    </div>
    <div id="timer">--:--:--</div>
  </header>

  <main>
    <!-- Layer status -->
    <section>
      <h2>Evidence Layers</h2>
      <div class="layers-grid" id="layers-grid">
        <span style="color:var(--muted);font-size:0.85rem">Loading…</span>
      </div>
    </section>

    <!-- SQL Console -->
    <section>
      <h2>SQL Console — SELECT only</h2>
      <div class="query-area">
        <div class="query-toolbar">
          <label>Query:</label>
          <button id="run-btn" onclick="runQuery()">▶ Run</button>
        </div>
        <textarea id="sql-input" spellcheck="false" placeholder="SELECT * FROM flight_telemetry LIMIT 20"></textarea>
        <div id="error-msg"></div>
        <div class="results-wrap"><table id="results-table"></table></div>
        <div id="row-count"></div>
      </div>
      <p class="hint" style="margin-top:8px">Only SELECT is allowed. Queries on locked tables will be blocked.</p>
    </section>

    <!-- Submit -->
    <section>
      <h2>Submit Your Verdict</h2>
      <div class="submit-form">
        <div class="field">
          <label>Team Name</label>
          <input id="team-input" type="text" placeholder="e.g. Team Alpha" />
        </div>
        <div class="field" style="flex:2">
          <label>Answer — Culprit, Method &amp; Motive</label>
          <textarea id="answer-input" placeholder="Culprit: …&#10;Method: …&#10;Motive: …"></textarea>
        </div>
        <button id="submit-btn" onclick="submitAnswer()">Submit</button>
      </div>
      <div id="submit-msg"></div>
    </section>
  </main>

  <script>
    let startedAt = null;
    let clockOffset = 0;

    async function refreshState() {
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        startedAt = data.startedAt ? new Date(data.startedAt) : null;
        clockOffset = data.clockOffset || 0;
        renderLayers(data.layers);
      } catch (_) {}
    }

    function renderLayers(layers) {
      const grid = document.getElementById('layers-grid');
      if (!layers || !layers.length) { grid.innerHTML = '<span style="color:var(--muted)">Game not started yet.</span>'; return; }
      grid.innerHTML = layers.map(l => `
        <span class="layer-chip ${l.isUnlocked ? 'unlocked' : 'locked'}">
          <span class="dot ${l.isUnlocked ? 'unlocked' : 'locked'}"></span>
          Layer ${l.id}: ${l.name} ${l.isUnlocked ? '✓' : `(T+${l.unlockMinutes}min)`}
        </span>
      `).join('');
    }

    function updateTimer() {
      const el = document.getElementById('timer');
      if (!startedAt) { el.textContent = 'Not started'; return; }
      const elapsed = (Date.now() - startedAt.getTime()) / 1000 + clockOffset * 60;
      const h = Math.floor(elapsed / 3600);
      const m = Math.floor((elapsed % 3600) / 60);
      const s = Math.floor(elapsed % 60);
      el.textContent = `T+ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    async function runQuery() {
      const sql = document.getElementById('sql-input').value.trim();
      const err = document.getElementById('error-msg');
      const table = document.getElementById('results-table');
      const count = document.getElementById('row-count');
      err.style.display = 'none';
      table.innerHTML = '';
      count.textContent = '';
      if (!sql) return;
      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sql }),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
        if (!data.rows.length) { count.textContent = '0 rows returned'; return; }
        const cols = Object.keys(data.rows[0]);
        table.innerHTML = `
          <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${data.rows.map(r =>
            `<tr>${cols.map(c => `<td>${r[c] ?? ''}</td>`).join('')}</tr>`
          ).join('')}</tbody>
        `;
        count.textContent = `${data.rows.length} row${data.rows.length === 1 ? '' : 's'} returned`;
      } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
      }
    }

    document.getElementById('sql-input').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runQuery();
    });

    async function submitAnswer() {
      const team = document.getElementById('team-input').value.trim();
      const answer = document.getElementById('answer-input').value.trim();
      const msg = document.getElementById('submit-msg');
      if (!team || !answer) { msg.style.color = '#ef4444'; msg.textContent = 'Please fill in your team name and answer.'; return; }
      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team, answer }),
        });
        if (res.ok) {
          msg.style.color = '#10b981';
          msg.textContent = '✓ Submission received!';
        } else {
          const d = await res.json();
          msg.style.color = '#ef4444';
          msg.textContent = d.error || 'Submission failed';
        }
      } catch (e) {
        msg.style.color = '#ef4444';
        msg.textContent = e.message;
      }
    }

    refreshState();
    setInterval(refreshState, 15000);
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
